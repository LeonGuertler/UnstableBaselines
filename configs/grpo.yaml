run: "grpo-default"
project: "maverick"
model_name: &model_name "Qwen/Qwen3-1.7B-Base"
collection_workers: 256
evaluation_workers: 16
logging_dir: "outputs"
training_iterations: &training_iterations 1000

checkpoint:
  uid: "base"
  path: null
  iteration: 0

env_sampler:
  type: "random"
  train:
    - id: "SimpleTak-v0-train"
      num_players: 2
      num_actors: 2
      prompt_template: "qwen3-zs"
  eval:
    - id: "SimpleTak-v0-train"
      num_players: 2
      prompt_template: "qwen3-zs"
    - id: "KuhnPoker-v0-train"
      num_players: 2
      prompt_template: "qwen3-zs"

action_sampler:
  type: "default"

model_sampler:
  type: "mirror"
  registry:
    type: "default"
    fixed_opponents:
      - "meta-llama/llama-4-maverick"

learner:
  type: "grpo"
  num_gpus: 1
  num_training_steps: *training_iterations
  model_name: *model_name
  epochs: 1
  batch_size: 256
  mini_batch_size: 1
  infer_mini_batch_size: 4
  learning_rate: 0.00
  actor_lr_scheduler_type: "linear"
  actor_lr_warmup_ratio: 0.025
  clip_ratio: 0.2
  grad_clip: 0.2
  entropy_coeff: 0.0
  beta: 0.0
  actor_grad_accumulation_steps: 2
  max_train_len: 3000
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

replay_buffer:
  type: "episode_buffer"
  max_buffer_size: 512
  reward_transformations:
    final: {}
    step:
      format_reward:
        reward: 1.5
      invalid_move_penalty:
        reward: 1.0
        penalty: -1.0
    sampling:
        group_relative_advantage: {}

vllm_config:
  model_name: *model_name
  temperature: 0.6
  max_tokens: *max_generation_len
  max_parallel_seq: 128
  max_loras: 8
  max_model_len: 8192
  lora_config: *lora_cfg