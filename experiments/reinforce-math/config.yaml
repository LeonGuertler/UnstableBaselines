run: "reinforce-math"
project: "Unstable-Baselines"
model_name: &model_name "Qwen/Qwen3-4B-Base"
max_concurrent_workers: 384
collection_workers: 384
evaluation_workers: 384
evaluation_runs: 1000
evaluation_steps: 20
logging_dir: "experiments/reinforce-math/outputs"
training_iterations: &training_iterations 600

checkpoint:
  policy:
    uid: "base"
    path: null
  iteration: 0
  wandb_id: null
  eval_checkpoints: []

env_sampler:
  type: "random"
  train:
    - id: "math-12k-v0"
      num_players: 1
      num_actors: 1
      prompt_template: "qwen3-math"
      action_extraction_fn: "judge"
      group_size: 8
  eval:
    - id: "math500-v0"
      num_players: 1
      prompt_template: "qwen3-math"
      action_extraction_fn: "judge"
      fixed_opponent: null

action_sampler:
  type: "default"

model_sampler:
  type: "mirror"
  fixed_checkpoints: []

learner:
  type: "grpo"
  num_gpus: 1
  total_training_steps: *training_iterations
  model_name: *model_name
  local_batch_size: 512
  micro_batch_size: 1
  learning_rate: 0.00001
  lr_scheduler_type: "constant"
  lr_warmup_ratio: 0.01
  epochs: 1
  temperature: 1.0
  grad_clip: 0.1
  loss: "grpo"
  kl_coef: 0.0
  entropy_coeff: 0.0
  max_train_len: null
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  activation_checkpointing: false
  gradient_checkpointing: false
  use_trainer_cache: false

replay_buffer:
  type: "episode_buffer"
  flatten: true
  max_buffer_size: 1024
  group_size: 8
  reward_transformations:
    final: {}
    step:
      format_reward:
        reward: 0.1
        penalty: -0.1
    sampling:
      group_relative_advantage: {}

vllm_config:
  model_name: *model_name
  temperature: 1.0
  top_k: 100
  top_p: 0.95
  max_tokens: *max_generation_len
  max_parallel_seq: 128
  max_loras: 24
  max_cpu_loras: 24
  max_model_len: 8192
  lora_config: *lora_cfg
