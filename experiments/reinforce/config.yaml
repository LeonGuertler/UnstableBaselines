run: "reinforce"
project: "Unstable-Baselines"
model_name: &model_name "Qwen/Qwen3-4B-Base"
max_concurrent_workers: 384
collection_workers: 384
evaluation_workers: 384
evaluation_runs: 128
evaluation_steps: 25
logging_dir: "experiments/reinforce/outputs"
training_iterations: &training_iterations 600

checkpoint:
  policy:
    uid: "base"
    path: null
  iteration: 0
  wandb_id: null
  eval_checkpoints: []

env_sampler:
  type: "random"
  train:
    - id: "TicTacToe-v0-train"
      num_players: 2
      num_actors: 1
      prompt_template: "qwen3-zs"
  eval: 
    - id: "TicTacToe-v0-train"
      num_players: 2
      fixed_opponent: "google/gemini-2.5-flash-lite"

action_sampler:
  type: "default"

model_sampler:
  type: "fixed"
  opponent_top_k: 20
  opponent_temperature: 0.1
  fixed_checkpoints:
    - uid: "reinforce-399"
      path: "experiments/reinforce/outputs/2026-04-01/11-53-36/reinforce/checkpoints/iteration-399"

learner:
  type: "grpo"
  num_gpus: 1
  total_training_steps: *training_iterations
  eval_steps: 100
  model_name: *model_name
  local_batch_size: 512
  micro_batch_size: 1
  learning_rate: 0.00001
  lr_scheduler_type: "constant"
  lr_warmup_ratio: 0.01
  epochs: 1
  loss: "grpo"
  temperature: 1.0
  grad_clip: 0.2
  max_train_len: null
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  activation_checkpointing: false
  gradient_checkpointing: false
  use_trainer_cache: false

replay_buffer:
  type: "step_buffer"
  max_buffer_size: 1024
  reward_transformations:
    final:
      role_advantage: {}
    step:
      format_reward:
        reward: 0.1
        penalty: -0.1
      invalid_move_penalty:
        reward: 0.2
        penalty: -0.2
    sampling:
      normalize_by_env:
        z_score: true

vllm_config:
  model_name: *model_name
  temperature: 1.0
  top_k: 100
  top_p: 0.95
  max_tokens: *max_generation_len
  max_parallel_seq: 100
  max_loras: 24
  max_cpu_loras: 24
  max_model_len: 4096
  lora_config: *lora_cfg
