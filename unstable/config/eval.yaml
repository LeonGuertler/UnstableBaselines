run: "UB-eval"
project: "Benchmarking-Eval"
model_name: &model_name "Qwen/Qwen3-4B-Base"
num_eval_workers: 128
num_actors: 4
output_dir: "outputs/game_eval/results"

environments:
  - env_id: "ConnectFour-v0-train"
    num_players: 2
    prompt_template: "qwen3-zs"
    fixed_opponent: "google/gemini-2.0-flash-lite-001"
num_runs_per_env: 128
error_allowance: 1

vllm_config:
  model_name: *model_name
  temperature: 0.6
  max_parallel_seq: 64
  max_loras: 8
  max_model_len: 8192
  lora_config:
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"