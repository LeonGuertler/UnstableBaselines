run: "base-2epoch"
project: "Benchmarking-Eval"
model_name: &model_name "Qwen/Qwen3-1.7B-Base"
num_eval_workers: 16
output_dir: "eval_results"

environments:
  - env_id: "Snake-v0-train"
    num_players: 2
    prompt_template: "qwen3-zs"
num_runs_per_env: 10

vllm_config:
  model_name: *model_name
  temperature: 0.6
  max_tokens: 2048
  max_parallel_seq: 128
  max_loras: 8
  max_model_len: 8192
  lora_config:
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"