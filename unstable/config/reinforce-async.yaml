run: "default"
project: "Test"
model_name: &model_name "Qwen/Qwen3-1.7B-Base"
collection_workers: 320
evaluation_workers: 0
logging_dir: "outputs"
training_iterations: &training_iterations 600

checkpoint:
  uid: "base"
  path: null
  iteration: 0
  wandb_id: null

env_sampler:
  type: "random"
  train:
    - id: "ConnectFour-v0-train"
      num_players: 2
      num_actors: 2
      prompt_template: "qwen3-zs"
  eval:
    - id: "ConnectFour-v0-train"
      num_players: 2
      prompt_template: "qwen3-zs"

action_sampler:
  type: "default"

model_sampler:
  type: "asynchronous"
  k: 50

learner:
  num_gpus: 1
  type: "reinforce-async"
  total_training_steps: *training_iterations
  model_name: *model_name
  local_batch_size: 384
  micro_batch_size: 1
  learning_rate: 0.000001
  lr_scheduler_type: "constant"
  lr_warmup_ratio: 0.01
  grad_clip: 0.2
  max_train_len: null
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  activation_checkpointing: false
  gradient_checkpointing: false
  use_trainer_cache: false

replay_buffer:
  type: "step_buffer"
  max_buffer_size: 768
  reward_transformations:
    final:
      role_advantage: {}
    step:
      format_reward:
        reward: 1.5
      invalid_move_penalty:
        reward: 1.0
        penalty: -1.0
    sampling:
      normalize_by_env:
        z_score: true

vllm_config:
  model_name: *model_name
  temperature: 0.6
  max_tokens: *max_generation_len
  max_parallel_seq: 64
  max_loras: 8
  max_model_len: 8192
  lora_config: *lora_cfg