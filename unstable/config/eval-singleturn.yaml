run: "eval"
project: "Benchmarking-Eval"
model_name: &model_name "Qwen/Qwen3-4B-Base"
num_actors: 3
num_eval_workers: 300
output_dir: "outputs/benchmarks/"
 
environments:
  - env_id: "aime-2024-v0"
    num_players: 1
    prompt_template: "qwen3-math"
    action_extraction_fn: "none"
    fixed_opponent: null
num_runs_per_env: 60
 
vllm_config:
  model_name: *model_name
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_parallel_seq: 100
  max_loras: 8
  max_model_len: 8192
  max_tokens: 4096
  lora_config:
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"