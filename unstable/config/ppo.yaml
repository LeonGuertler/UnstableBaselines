run: "default"
project: "Unstable-Baselines"
model_name: &model_name "Qwen/Qwen3-1.7B-Base"
max_concurrent_workers: 128
collection_workers: 128
evaluation_workers: 128
evaluation_runs: 128
evaluation_steps: 40
logging_dir: "outputs"
training_iterations: &training_iterations 600

checkpoint:
  policy: 
    uid: "base"
    path: null
  critic:
    uid: "base"
    path: null
  iteration: 0
  wandb_id: null

env_sampler:
  type: "random"
  train:
    - id: "SimpleTak-v0-train"
      num_players: 2
      num_actors: 2
      prompt_template: "qwen3-zs"
  eval:
    - id: "SimpleTak-v0-train"
      num_players: 2
      prompt_template: "qwen3-zs"
      kind: checkpoint

action_sampler:
  type: "default"

model_sampler:
  type: "mirror"
  opponent_top_k: 20
  opponent_temperature: 0.1

learner:
  type: "ppo"
  num_gpus: 1
  total_training_steps: *training_iterations
  eval_steps: 100
  model_name: *model_name
  epochs: 1
  temperature: 0.7
  local_batch_size: 256
  micro_batch_size: 1
  learning_rate: 0.000001
  lr_scheduler_type: "constant"
  lr_warmup_ratio: 0.01
  infer_micro_batch_size: 4
  critic_learning_rate: 0.00001
  critic_lr_scheduler_type: "constant"
  critic_lr_warmup_ratio: 0.01
  upper_clip_ratio: 0.4
  lower_clip_ratio: 0.2
  grad_clip: 0.2
  entropy_coeff: 0.0
  value_coeff: 0.5
  beta: 0.0
  gamma: 0.7
  gae_lambda: 0.9
  normalize_adv: true
  clip_value: 0.2
  max_train_len: null
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  activation_checkpointing: false
  gradient_checkpointing: false
  use_trainer_cache: false

replay_buffer:
  type: "episode_buffer"
  max_buffer_size: 768
  reward_transformations:
    final: {}
    step:
      format_reward:
        reward: 0.1
      invalid_move_penalty:
        reward: 0.1
        penalty: -0.1
    sampling: {}

vllm_config:
  model_name: *model_name
  temperature: 0.7
  top_k: 100
  top_p: 0.95
  max_tokens: *max_generation_len
  max_parallel_seq: 100
  max_loras: 8
  max_model_len: 8192
  lora_config: *lora_cfg