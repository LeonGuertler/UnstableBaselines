run: "default"
project: "UB-Benchmarking"
model_name: &model_name "Qwen/Qwen3-4B-Base"
collection_workers: 384
evaluation_workers: 0
logging_dir: "outputs"
training_iterations: &training_iterations 600

checkpoint:
  uid: "base"
  path: null
  iteration: 0
  wandb_id: null

env_sampler:
  type: "random"
  train:
    - id: "SimpleTak-v0-train"
      num_players: 2
      num_actors: 2
      prompt_template: "qwen3-zs"
  eval:
    - id: "SimpleTak-v0-train"
      num_players: 2
      prompt_template: "qwen3-zs"

action_sampler:
  type: "default"

model_sampler:
  type: "mirror"
  fixed_opponents:
    - "google/gemini-2.0-flash-lite-001"

learner:
  type: "ppo"
  total_training_steps: *training_iterations
  model_name: *model_name
  epochs: 2
  local_batch_size: 256
  micro_batch_size: 1
  learning_rate: 0.00001
  lr_scheduler_type: "constant"
  lr_warmup_ratio: 0.01
  critic_learning_rate: 0.0001
  clip_ratio: 0.3
  grad_clip: 0.2
  entropy_coeff: 0.0
  value_loss_coeff: 0.5
  beta: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  normalize_adv: true
  clip_value: 0.2
  max_train_len: null
  max_generation_len: &max_generation_len 4096
  lora_cfg: &lora_cfg
    lora_rank: 32
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  activation_checkpointing: false
  gradient_checkpointing: false
  use_trainer_cache: false

replay_buffer:
  type: "step_buffer"
  max_buffer_size: 512
  reward_transformations:
    final: {}
    step:
      format_reward:
        reward: 1.5
      invalid_move_penalty:
        reward: 1.0
        penalty: -1.0
    sampling:
      normalize_by_env:
        z_score: true

vllm_config:
  model_name: *model_name
  temperature: 0.6
  max_tokens: *max_generation_len
  max_parallel_seq: 128
  max_loras: 8
  max_model_len: 8192
  lora_config: *lora_cfg